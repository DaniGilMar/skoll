<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a2332"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="blade" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c0c0c0"/>
      <stop offset="100%" stop-color="#808080"/>
    </linearGradient>
  </defs>
  <!-- Shield -->
  <path d="M100 8 L185 45 L185 105 Q185 155 100 190 Q15 155 15 105 L15 45 Z"
        fill="url(#shield)" stroke="#58a6ff" stroke-width="3"/>
  <!-- Shield border accent -->
  <path d="M100 16 L175 49 L175 103 Q175 148 100 180 Q25 148 25 103 L25 49 Z"
        fill="none" stroke="#30363d" stroke-width="1"/>
  <!-- Left axe -->
  <g transform="translate(100,100) rotate(-45) translate(-60,-8)">
    <!-- Handle -->
    <rect x="55" y="0" width="6" height="80" rx="2" fill="#8b6914"/>
    <!-- Blade -->
    <path d="M58 0 L58 -30 Q70 -35 80 -25 L80 -15 Q70 -10 58 -8 Z"
          fill="url(#blade)" stroke="#666" stroke-width="1"/>
    <path d="M58 -30 Q58 -40 65 -42 L75 -35 Q70 -30 58 -28 Z"
          fill="none" stroke="#666" stroke-width="1"/>
    <!-- Edge highlight -->
    <path d="M58 -30 Q65 -32 75 -28" stroke="#fff" stroke-width="0.5" fill="none" opacity="0.3"/>
  </g>
  <!-- Right axe -->
  <g transform="translate(100,100) rotate(45) translate(-60,-8) scale(-1,1)">
    <!-- Handle -->
    <rect x="55" y="0" width="6" height="80" rx="2" fill="#8b6914"/>
    <!-- Blade -->
    <path d="M58 0 L58 -30 Q70 -35 80 -25 L80 -15 Q70 -10 58 -8 Z"
          fill="url(#blade)" stroke="#666" stroke-width="1"/>
    <path d="M58 -30 Q58 -40 65 -42 L75 -35 Q70 -30 58 -28 Z"
          fill="none" stroke="#666" stroke-width="1"/>
    <path d="M58 -30 Q65 -32 75 -28" stroke="#fff" stroke-width="0.5" fill="none" opacity="0.3"/>
  </g>
  <!-- Center rune S -->
  <text x="100" y="108" text-anchor="middle" font-family="serif" font-size="32"
        font-weight="bold" fill="#58a6ff" opacity="0.9">ᛋ</text>
  <!-- Accent dots -->
  <circle cx="100" cy="28" r="2" fill="#58a6ff" opacity="0.6"/>
  <circle cx="100" cy="178" r="2" fill="#58a6ff" opacity="0.6"/>
</svg>
